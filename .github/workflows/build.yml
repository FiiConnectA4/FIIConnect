name: Build
on:
  push:
    branches:
      - main
     # - dev for integrating 
      - tudor/sonarQube
  pull_request:
    branches:
      - main
     # - dev
      - tudor/sonarQube
    types: [opened, synchronize, reopened]
jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  maven-build:
    name: Build and analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Start Oracle DB
        run: |
          docker run --name oracle-free -d -p 1521:1521 -e ORACLE_PASSWORD=api_test gvenzl/oracle-free

      - name: Copy SQL files into Oracle container
        run: |
          docker cp containers/OracleDB/create_user.sql oracle-free:/tmp/
          docker cp backend/scripts/didactic/didactic_table_create.sql oracle-free:/tmp/
          docker cp backend/scripts/didactic/didactic_sequence_create.sql oracle-free:/tmp/
          docker cp backend/scripts/didactic/didactic_table_populate.sql oracle-free:/tmp/

      - name: Wait for Oracle to be ready
        run: |
          echo "Waiting for Oracle to be ready..."
          until docker logs oracle-free 2>&1 | grep -q "DATABASE IS READY TO USE"; do
            sleep 5
          done
          echo "Oracle is ready!"

      - name: Populate Oracle DB
        run: |
          docker exec oracle-free bash -c "echo exit | sqlplus sys/api_test as sysdba @/tmp/create_user.sql"
          sleep 2
          docker exec oracle-free bash -c "echo exit | sqlplus api_test/api_test @/tmp/didactic_table_create.sql"
          sleep 2
          docker exec oracle-free bash -c "echo exit | sqlplus api_test/api_test @/tmp/didactic_sequence_create.sql"
          sleep 2
          docker exec oracle-free bash -c "echo exit | sqlplus api_test/api_test @/tmp/didactic_table_populate.sql"

      - name: Start SFTP Server
        run: |
          mkdir -p sftp_volume
          docker run -d -p 2222:22 -v "$PWD/sftp_volume:/home/fiiconnect/faculty_files" atmoz/sftp fiiconnect:fiiconnect:::faculty_files

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'zulu'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Build and run tests + SonarQube
        working-directory: backend/api
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
           mvn -B verify \
            -Dspring.datasource.url=jdbc:oracle:thin:@localhost:1521/FREE \
            -Dspring.datasource.username=api_test \
            -Dspring.datasource.password=api_test \
            -Dsftp.host=localhost \
            -Dsftp.port=2222 \
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=FiiConnectA4_FIIConnect \
            -Dsonar.organization=fiiconnecta4 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
      - name: Dump surefire logs (on failure)
        if: failure()
        run: cat backend/api/target/surefire-reports/*.txt || true
     
